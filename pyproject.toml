[project]
name = "autovid"
version = "0.1.0"
description = "AI-powered automatic video editor: ingest, understand, organize, and rough-cut raw footage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    # 13.x fixes every known advisory against ≤12.x but needs Python ≥3.11;
    # on 3.10 the floor keeps the best available build. The parser is on-path
    # (decodes frames extracted from untrusted footage) — upgrade the venv to
    # 3.11+ to pick up the fixed line.
    "pillow>=13; python_version >= '3.11'",
    "pillow>=10.4; python_version < '3.11'",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Match DecisionMCP's server SDK generation (its client API differs in 2.x).
    "mcp>=1.9,<2",
    # Music-driven editing: beat/tempo/energy analysis. <1: 1.0 (2026-08) is
    # untested here — lift the ceiling deliberately after verifying.
    "librosa>=0.10,<1",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
app = [
    "pywebview>=5.0",
]

[project.scripts]
autovid = "autovid.cli:main"
autovid-app = "autovid.app_main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autovid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
